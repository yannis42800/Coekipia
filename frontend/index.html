<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filtrage &amp; tri de produits — Coekipia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..500;1,9..144,300..500&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <div class="wrap">
    <span class="logo">Coekipia</span>
  </div>
</header>

<div class="hero">
  <div class="wrap">
    <span class="badge"><i class="dot" id="dot"></i><span id="backend-status">détection…</span></span>
    <h1>Filtrage &amp; <em>tri</em><br>de produits</h1>
    <p>Filtrez le catalogue, triez, comparez. Deux backends, une seule interface.</p>
    <div class="backend">
      <div class="seg" role="group" aria-label="Backend">
        <button type="button" id="backend-node-btn" data-base="http://localhost:3000" aria-pressed="true">Node</button>
        <button type="button" id="backend-java-btn" data-base="http://localhost:3001" aria-pressed="false">Java</button>
      </div>
    </div>
  </div>
</div>

<main class="wrap">
  <section>
    <form id="filter-form">
      <label>
        Champ à filtrer
        <select id="filterField"><option value="">(aucun)</option></select>
      </label>
      <label>
        Valeur
        <input id="filterValue" type="text" placeholder="ex: Electronique" list="filterValueList" autocomplete="off" />
        <datalist id="filterValueList"></datalist>
      </label>
      <label>
        Trier par
        <select id="sortField"></select>
      </label>
      <label>
        Ordre
        <select id="sortOrder">
          <option value="asc">Croissant</option>
          <option value="desc">Décroissant</option>
        </select>
      </label>
      <button class="pill primary" type="submit">Appliquer</button>
    </form>
    <div id="error"></div>
  </section>

  <section id="resultats">
    <div class="tw">
      <table>
        <thead id="table-head"></thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
    <div class="stats">
      <div class="stat"><b id="s-count">0</b><span>produits affichés</span></div>
      <div class="stat"><b id="s-price">—</b><span>prix moyen (€)</span></div>
      <div class="stat"><b id="s-stock">—</b><span>unités en stock</span></div>
    </div>
  </section>
</main>

<footer><div class="wrap">Coekipia · Filtrage &amp; tri de produits</div></footer>

<script src="script.js"></script>
</body>
</html>
