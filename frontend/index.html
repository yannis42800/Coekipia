<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Filtrage &amp; tri — Coekipia</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.3rem; }
  .backend-badge { font-size: 0.85rem; color: #555; margin-bottom: 1.5rem; }
  form { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: end; margin-bottom: 1.5rem; }
  label { display: flex; flex-direction: column; font-size: 0.8rem; gap: 0.25rem; }
  select, input, button { padding: 0.4rem; font-size: 0.9rem; }
  button { cursor: pointer; }
  table { width: 100%; border-collapse: collapse; }
  th, td { border: 1px solid #ddd; padding: 0.5rem; text-align: left; font-size: 0.9rem; }
  th { background: #f5f5f5; }
  #error { color: #b00020; font-size: 0.85rem; margin-bottom: 1rem; }
</style>
</head>
<body>
  <h1>Filtrage &amp; tri de produits</h1>
  <p class="backend-badge">Backend actif : <span id="backend-status">détection…</span></p>

  <form id="filter-form">
    <label>
      Champ à filtrer
      <select id="filterField"><option value="">(aucun)</option></select>
    </label>
    <label>
      Valeur
      <input id="filterValue" type="text" placeholder="ex: Electronique" />
    </label>
    <label>
      Trier par
      <select id="sortField"></select>
    </label>
    <label>
      Ordre
      <select id="sortOrder">
        <option value="asc">Croissant</option>
        <option value="desc">Décroissant</option>
      </select>
    </label>
    <button type="submit">Appliquer</button>
  </form>

  <div id="error"></div>
  <table>
    <thead id="table-head"></thead>
    <tbody id="table-body"></tbody>
  </table>

  <script>
    // Contrat commun aux deux backends (Node/TypeScript et Java) :
    //  GET /api/products/fields
    //  GET /api/products?filterField=&filterValue=&sortField=&sortOrder=asc|desc
    // Le front ne change pas selon le backend lancé sur ce port.
    const API_BASE = 'http://localhost:3000';

    const filterFieldSelect = document.getElementById('filterField');
    const filterValueInput = document.getElementById('filterValue');
    const sortFieldSelect = document.getElementById('sortField');
    const sortOrderSelect = document.getElementById('sortOrder');
    const tableHead = document.getElementById('table-head');
    const tableBody = document.getElementById('table-body');
    const errorBox = document.getElementById('error');
    const backendStatus = document.getElementById('backend-status');

    let fields = [];

    async function loadFields() {
      const res = await fetch(`${API_BASE}/api/products/fields`);
      const data = await res.json();
      fields = data.fields;

      for (const field of fields) {
        filterFieldSelect.add(new Option(field.name, field.name));
        sortFieldSelect.add(new Option(field.name, field.name));
      }

      tableHead.innerHTML = `<tr>${fields.map((f) => `<th>${f.name}</th>`).join('')}</tr>`;
    }

    async function loadProducts() {
      errorBox.textContent = '';

      const params = new URLSearchParams();
      if (filterFieldSelect.value) {
        params.set('filterField', filterFieldSelect.value);
        params.set('filterValue', filterValueInput.value);
      }
      params.set('sortField', sortFieldSelect.value);
      params.set('sortOrder', sortOrderSelect.value);

      const res = await fetch(`${API_BASE}/api/products?${params.toString()}`);
      const data = await res.json();

      if (!res.ok) {
        errorBox.textContent = data.error ?? 'Erreur inconnue';
        tableBody.innerHTML = '';
        return;
      }

      tableBody.innerHTML = data
        .map((item) => `<tr>${fields.map((f) => `<td>${item[f.name]}</td>`).join('')}</tr>`)
        .join('');
    }

    document.getElementById('filter-form').addEventListener('submit', (event) => {
      event.preventDefault();
      loadProducts();
    });

    (async () => {
      try {
        await loadFields();
        backendStatus.textContent = `en ligne sur ${API_BASE}`;
        await loadProducts();
      } catch (err) {
        backendStatus.textContent = 'injoignable';
        errorBox.textContent = `Impossible de contacter l'API sur ${API_BASE}. Démarrez le backend Node ou Java.`;
      }
    })();
  </script>
</body>
</html>
